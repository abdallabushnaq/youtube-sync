# Open the default browser automatically on startup.
server.port=8080
# Disable the Vite/hot-deploy dev server and run in production mode so Vaadin uses the
# pre-built production bundle (produced by vaadin:build-frontend with forceProductionBuild=true).
# vaadin-dev is not on the classpath; both properties are required together.
vaadin.frontend.hotdeploy=false
#vaadin.productionMode=true
#vaadin.launch-browser=true
# Reduce startup noise.
spring.jmx.enabled=false
# Launch the default browser when starting the application in development mode
#vaadin.launch-browser=true
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,de.bushnaq.abdalla
vaadin.url-mapping=/*


